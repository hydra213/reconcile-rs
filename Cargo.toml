[package]
name = "reconcilers"
version.workspace = true
edition = "2024"
description = "Deterministic data reconciliation for Parquet datasets: schema, keys, values and auditable verdicts."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hydra213/reconcile-rs"
keywords = ["parquet", "arrow", "reconciliation", "data-quality", "diff"]
categories = ["command-line-utilities", "database"]
exclude = ["/python", "/.github"]

# The Python package in `python/` is a second crate that wraps this one. It
# is a workspace member so both always build against the same Arrow version.
# Plain `cargo build` and `cargo test` here still build this crate only.
[workspace]
members = ["python"]

# The one version number of the project. The Rust crate, the command-line
# tool and the Python package all take it from here, and the release
# workflow refuses to publish when a tag such as `v0.1.0` disagrees with it.
[workspace.package]
version = "0.1.0"

# Versions are pinned to a minor release on purpose. Arrow and Parquet release
# together and must always share the same major version.
[dependencies]
anyhow = "1.0"
# `chrono-tz` lets timestamps carry named time zones such as `UTC` or
# `Australia/Sydney`, which CSV columns can declare.
arrow = { version = "60.1", default-features = false, features = ["chrono-tz"] }
arrow-csv = "60.1"
blake3 = "1.8"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
object_store = { version = "0.14", features = ["aws", "azure", "gcp"] }
parquet = "60.1"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["rt"] }
toml = "1.2"
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
insta = "1.49"
proptest = "1.11"
url = "2"
